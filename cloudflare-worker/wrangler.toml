name = "omda-gold-bot"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================
# CRON TRIGGERS — 24/7 hourly delivery
# ===========================================
# Cloudflare Workers Cron Triggers are GUARANTEED to fire — unlike Vercel
# Hobby (which only supports daily crons) or UptimeRobot (which can be
# flaky). Cloudflare's scheduler runs every minute and dispatches to our
# Worker at the configured times.
#
# "0 * * * *" = minute 0 of every hour (i.e. :00), every day.
# This matches the user's requirement: "تحديث الساعة على :00".
# The Worker's scheduled() handler acquires an hour-bucket lock (stored in
# KV) so even if multiple triggers fire, only ONE send per hour.
[[triggers.crons]]
cron = "0 * * * *"

# ===========================================
# KV NAMESPACE — subscriber cache + dedup
# ===========================================
# Bind via `wrangler kv:namespace create SUBSCRIBERS` then fill the id below.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "0b56e3ecfe53487daa7f436ae881c225"

# ===========================================
# SECRETS (set via `wrangler secret put`)
# ===========================================
# - BOT_TOKEN      — Telegram bot token (8935785205:...)
# - ADMIN_PASSWORD — Production admin password (for syncing subscribers)
# - PRODUCTION_URL — https://omda-gold-bot.vercel.app
#
# These are NOT inlined here for security. Set them with:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put PRODUCTION_URL

[observability]
enabled = true

[vars]
# Non-secret config can live here
TZ = "Africa/Cairo"
